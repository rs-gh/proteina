# @package _global_
defaults:
  - /training_ca
  - _self_

run_name_: proteina_60m_repa_l0_256_per_residue

dataset: pdb_lmdb_256
dataset_config_subdir: pdb

compile: true

log:
  wandb_project: proteina-repa
  checkpoint_every_n_steps: 100000
  last_ckpt_every_n_steps: 3500

ema:
  validate_original_weights: True

repa:
  encoder:
    type: gearnet
    gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
  layers: [0]
  lambda_repa: 0.5
  combination_mode: additive
  similarity_type: cosine
  averaging: per_residue
  projector_hidden_dim: 512
  projector_num_layers: 2  # Pinned at 2 (NOT the audit default of 3): last.ckpt under this run_name_ was saved 2026-04-17/20 with depth=2; bumping to 3 here would shape-mismatch on Lightning auto-resume. To switch to depth=3, copy this file under a new run_name_ (e.g. *_v2) instead of editing in place.

eval_callback:
  enabled: false
  compute_every_n_steps: 50000
  num_samples: 30
  length: 100
  compute_gearnet: true
  compute_designability: false
  compute_diversity: true
  gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
