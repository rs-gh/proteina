# @package _global_
# 2026-05-06: variant of bs80 REPA L4 with weight decay 1e-2 (AdamW).
# Optimizer is selected in model_trainer_base.configure_optimizers: weight_decay > 0
# triggers torch.optim.AdamW with decoupled decay. lr unchanged from the bs80 base
# so the only knob delta vs the baseline run is weight decay; testing whether
# regularisation helps val/loss generalisation on n=128 PDB.
defaults:
  - /training_ca
  - _self_

run_name_: proteina_60m_repa_l4_128_per_residue_bs80_wd1e-2

dataset: pdb_lmdb_128
dataset_config_subdir: pdb

compile: true

opt:
  weight_decay: 0.01  # AdamW decoupled decay; standard transformer recipe (Adam->AdamW switch is automatic in configure_optimizers when wd>0)

log:
  wandb_project: proteina-repa
  checkpoint_every_n_steps: 100000
  last_ckpt_every_n_steps: 3500

ema:
  validate_original_weights: True

repa:
  encoder:
    type: gearnet
    gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
  layers: [4]
  lambda_repa: 0.5
  combination_mode: additive
  similarity_type: cosine
  averaging: per_residue
  projector_hidden_dim: 512
  projector_num_layers: 3  # reference REPA depth (divergence from 256/512 configs which use 2)

eval_callback:
  enabled: true
  compute_every_n_steps: 50000
  num_samples: 30
  length: 100
  compute_gearnet: true
  compute_designability: false
  compute_diversity: true
  gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
