# @package _global_
# ProteinMPNN CA-only REPA target. Mirrors the n=128 GearNet l4 per-residue
# config so the comparison vs. CA-GearNet is one-to-one. Encoder dim is 128
# (vs. GearNet 512), so projector_hidden_dim is sized accordingly.
defaults:
  - /training_ca
  - _self_

run_name_: proteina_60m_repa_mpnn_l4_128_per_residue_bs80

dataset: pdb_lmdb_128
dataset_config_subdir: pdb

compile: true

log:
  wandb_project: proteina-repa
  checkpoint_every_n_steps: 100000
  last_ckpt_every_n_steps: 3500

ema:
  validate_original_weights: True

repa:
  encoder:
    type: mpnn
    mpnn_ckpt_path: ${oc.env:PROTEINMPNN_WEIGHTS_DIR}/ca_model_weights/v_48_020.pt
    hidden_dim: 128
    num_encoder_layers: 3
    k_neighbors: 48
    augment_eps: 0.0
  layers: [4]
  lambda_repa: 0.5
  combination_mode: additive
  similarity_type: cosine
  averaging: per_residue
  projector_hidden_dim: 128  # matches ProteinMPNN encoder_dim
  projector_num_layers: 3    # reference REPA depth (matches l4 GearNet config)

eval_callback:
  enabled: true
  compute_every_n_steps: 50000
  num_samples: 30
  length: 100
  compute_gearnet: true
  compute_designability: false
  compute_diversity: true
  gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
