datamodule:
  _target_: "proteinfoundation.datasets.pdb_data.PDBLightningDataModule"
  data_dir: ${oc.env:DATA_PATH}/pdb_train/
  lmdb_dir: ${oc.env:LMDB_DIR}  # set by training script: local NVMe copy or Lustre fallback
  in_memory: False
  format: "cif"
  overwrite: False
  batch_padding: True
  sampling_mode: "random"
  transforms:
    - _target_: "proteinfoundation.datasets.transforms.GlobalRotationTransform"
    - _target_: "proteinfoundation.datasets.transforms.ChainBreakPerResidueTransform"
    - _target_: "proteinfoundation.datasets.transforms.PaddingTransform"
      max_size: 512  # constant tensor shapes for torch.compile; ~88% PDB coverage
  batch_size: 8  # fits in A100 80GB with SDPA+compile (peak ~33GB at B=4, ~66GB at B=8)
  num_workers: 2  # spawn smoke test passed; 2 is sweet spot (no gain at 4)
  pin_memory: True

  # dataselector is still needed for prepare_data (CSV generation),
  # but LMDB path bypasses per-file loading in _get_dataset()
  dataselector:
    _target_: "proteinfoundation.datasets.pdb_data.PDBDataSelector"
    data_dir: ${oc.env:DATA_PATH}/pdb_train/
    fraction: 1.0
    molecule_type: "protein"
    experiment_types: ["diffraction", "EM"]
    min_length: 50
    max_length: 512
    oligomeric_min: null
    oligomeric_max: null
    best_resolution: 0.0
    worst_resolution: 5.0
    has_ligands: []
    remove_ligands: []
    remove_non_standard_residues: True
    remove_pdb_unavailable: True
    exclude_ids: []

  datasplitter:
    _target_: "proteinfoundation.datasets.pdb_data.PDBDataSplitter"
    data_dir: ${oc.env:DATA_PATH}/pdb_train/
    train_val_test: [0.98, 0.019, 0.001]
    split_type: "random"
    split_sequence_similarity: 0.5
    overwrite_sequence_clusters: False
