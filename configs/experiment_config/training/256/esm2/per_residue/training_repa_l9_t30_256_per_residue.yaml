# @package _global_
defaults:
  - /training_ca
  - _self_

# Mirrors training_repa_l9_256_per_residue.yaml but pulls ESM hidden state
# from layer 30 instead of the post-final-LayerNorm last_hidden_state (L33).
# Motivation: encoder_profiling/proteina/esm/FINDINGS.md shows L33's final LN
# squeezes per-residue norms 56x while preserving direction structure. L30 has
# comparable RankMe at much higher norm. n=256 companion to the n=128 t30
# experiment (training_repa_esm_l4_t30_128_per_residue.yaml).
run_name_: proteina_60m_repa_esm_l9_t30_256_per_residue

dataset: pdb_lmdb_256_bs12  # bs=12: bs=24 OOMs at n=256+ESM-650M (smoke job 28898440 step 184). Matches saved baseline regime.
dataset_config_subdir: pdb

compile: true

log:
  wandb_project: proteina-repa
  checkpoint_every_n_steps: 100000
  last_ckpt_every_n_steps: 3500

ema:
  validate_original_weights: True

repa:
  encoder:
    type: esm
    # Use the locally-staged weights when ESM_MODEL_PATH is set (avoids a
    # per-job HF download on compute nodes), fall back to the hub id otherwise.
    model_id: ${oc.env:ESM_MODEL_PATH,facebook/esm2_t33_650M_UR50D}
    layer: 30            # mid-network hidden state, before final LayerNorm
  layers: [9]
  lambda_repa: 0.5
  combination_mode: additive
  similarity_type: cosine
  averaging: per_residue
  projector_hidden_dim: 1280   # match ESM2-650M hidden_size
  projector_num_layers: 3

eval_callback:
  enabled: true
  compute_every_n_steps: 50000
  num_samples: 30
  length: 100
  compute_gearnet: true
  compute_designability: false
  compute_diversity: true
  gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
