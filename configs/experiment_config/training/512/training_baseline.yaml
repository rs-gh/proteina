# @package _global_
defaults:
  - /training_ca
  - _self_

run_name_: proteina_60m_baseline_v2

# Full dataset via LMDB (run convert_to_lmdb.sh first)
dataset: pdb_lmdb
dataset_config_subdir: pdb

# Enable torch.compile for faster training
compile: true

log:
  wandb_project: proteina-repa
  checkpoint_every_n_steps: 100000
  last_ckpt_every_n_steps: 3500

# Disable EMA weight swap during validation (crashes with torch 2.9 + Lightning)
ema:
  validate_original_weights: True

# Generation quality evaluation during training
eval_callback:
  enabled: true
  compute_every_n_steps: 50000
  num_samples: 30
  length: 100
  compute_gearnet: true
  compute_designability: false
  compute_diversity: true
  gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
