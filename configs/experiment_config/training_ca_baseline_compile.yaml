defaults:
  - training_ca
  - _self_

run_name_: proteina_60m_baseline_compile

# Full dataset with PaddingTransform for torch.compile
dataset: pdb_train_compile

# Enable torch.compile for faster training
compile: true

log:
  wandb_project: proteina-repa
  checkpoint_every_n_steps: 10000
  last_ckpt_every_n_steps: 3500

# Disable EMA weight swap during validation (crashes with torch 2.9 + Lightning)
ema:
  validate_original_weights: True
