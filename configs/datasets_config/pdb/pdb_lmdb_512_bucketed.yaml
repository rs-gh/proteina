datamodule:
  _target_: "proteinfoundation.datasets.pdb_data.PDBLightningDataModule"
  data_dir: ${oc.env:DATA_PATH}/pdb_train/
  lmdb_dir: ${oc.env:LMDB_DIR}
  lmdb_max_num_residues: 512  # filters dataset at load time; also required for LengthBucketedBatchSampler.get_lengths()
  in_memory: False
  format: "cif"
  overwrite: False
  batch_padding: True

  # Length-bucketed sampling: groups samples by residue length, yielding
  # fixed-shape (B, N) batches per bucket. The collator pads to
  # bucket_upper_edge rather than a global max, so torch.compile caches
  # one graph per bucket (P2 verified: ~400× revisit speedup).
  #
  # For different target seq-len ceilings, adjust `lmdb_max_num_residues`,
  # dataselector.max_length, and the bucket lists below — fewer / more
  # entries as appropriate. E.g., for n=256: [128, 256] with BS per P1.
  sampling_mode: "length-bucketed"
  bucket_boundaries: [128, 256, 384, 512]  # inclusive upper edges, ascending
  bucket_batch_sizes: [80, 24, 10, 6]      # P1 calibration gave max=[98, 28, 12, 7]; 80/24/10/6 leaves ~15-20% OOM headroom. Bucket 0 matches live-run BS for n=128 baselines (see reference_proteina_batch_sizes.md).
  batch_size: 6  # used only by val/test (they fall back to random sampling); safe for any sample length up to 512. Train path uses bucket_batch_sizes.

  transforms:
    - _target_: "proteinfoundation.datasets.transforms.GlobalRotationTransform"
    - _target_: "proteinfoundation.datasets.transforms.ChainBreakPerResidueTransform"
    # NOTE: PaddingTransform intentionally omitted — we pad to bucket_upper_edge
    # in the collator (DensePaddingCollater with bucket_boundaries set), not to
    # a global max in __getitem__. Adding PaddingTransform here would waste all
    # the savings by re-padding every sample to 512 before collation.

  num_workers: 2
  pin_memory: True

  dataselector:
    _target_: "proteinfoundation.datasets.pdb_data.PDBDataSelector"
    data_dir: ${oc.env:DATA_PATH}/pdb_train/
    fraction: 1.0
    molecule_type: "protein"
    experiment_types: ["diffraction", "EM"]
    min_length: 50
    max_length: 512
    oligomeric_min: null
    oligomeric_max: null
    best_resolution: 0.0
    worst_resolution: 5.0
    has_ligands: []
    remove_ligands: []
    remove_non_standard_residues: True
    remove_pdb_unavailable: True
    exclude_ids: []

  datasplitter:
    _target_: "proteinfoundation.datasets.pdb_data.PDBDataSplitter"
    data_dir: ${oc.env:DATA_PATH}/pdb_train/
    train_val_test: [0.98, 0.019, 0.001]
    split_type: "random"
    split_sequence_similarity: 0.5
    overwrite_sequence_clusters: False
