# @package _global_
# Fresh restart of GearNet random_init REPA run.
# Original run (proteina_60m_repa_l4_256_per_residue_random) was trained
# pre-audit with projector_num_layers=2; cannot resume under depth=3.
# Old checkpoints kept under the original run_name_ for analysis.
defaults:
  - /training_ca
  - _self_

run_name_: proteina_60m_repa_l4_256_per_residue_random_v2

dataset: pdb_lmdb_256_bs12
dataset_config_subdir: pdb

compile: true

hardware:
  ngpus_per_node_: 2

opt:
  val_check_interval: 10000000

log:
  wandb_project: proteina-repa
  checkpoint_every_n_steps: 100000
  last_ckpt_every_n_steps: 3500

ema:
  validate_original_weights: True

repa:
  encoder:
    type: gearnet
    random_init: true
    random_seed: 0
  layers: [4]
  lambda_repa: 0.5
  combination_mode: additive
  similarity_type: cosine
  averaging: per_residue
  projector_hidden_dim: 512
  projector_num_layers: 3

eval_callback:
  enabled: false
  compute_every_n_steps: 50000
  num_samples: 30
  length: 100
  compute_gearnet: true
  compute_designability: false
  compute_diversity: true
  gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
