# @package _global_
defaults:
  - /training_ca
  - _self_

run_name_: smoke_genmetrics_test

# Reuse existing LMDB with small batch size to avoid OOM
dataset: pdb_lmdb_smoke
dataset_config_subdir: pdb

compile: false

log:
  wandb_project: proteina-repa
  log_wandb: true
  checkpoint: false

ema:
  decay: 0
  validate_original_weights: True

opt:
  val_check_interval: 50
  max_epochs: 1

# Trigger generation metrics callback quickly
eval_callback:
  enabled: false
  compute_every_n_steps: 100
  num_samples: 3
  length: 60
  compute_gearnet: true
  compute_designability: false
  compute_diversity: true
  gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
