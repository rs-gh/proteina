# @package _global_
# ProteinMPNN CA-only REPA target at n=256. Mirrors the n=128 MPNN config
# (same encoder + projector settings) so the only change vs. n=128 is
# residue-length and dataset.
# Note: the existing n=256 GearNet config uses projector_num_layers=2 (older
# pre-2026-04-16-audit value); we keep 3 here to match the n=128 MPNN run and
# the reference REPA depth.
defaults:
  - /training_ca
  - _self_

run_name_: proteina_60m_repa_mpnn_l4_256_per_residue

dataset: pdb_lmdb_256
dataset_config_subdir: pdb

compile: true

log:
  wandb_project: proteina-repa
  checkpoint_every_n_steps: 100000
  last_ckpt_every_n_steps: 3500

ema:
  validate_original_weights: True

repa:
  encoder:
    type: mpnn
    mpnn_ckpt_path: ${oc.env:PROTEINMPNN_WEIGHTS_DIR}/ca_model_weights/v_48_020.pt
    hidden_dim: 128
    num_encoder_layers: 3
    k_neighbors: 48
    augment_eps: 0.0
  layers: [4]
  lambda_repa: 0.5
  combination_mode: additive
  similarity_type: cosine
  averaging: per_residue
  projector_hidden_dim: 128  # matches ProteinMPNN encoder_dim
  projector_num_layers: 3    # reference REPA depth (matches n=128 MPNN run)

eval_callback:
  enabled: false
  compute_every_n_steps: 50000
  num_samples: 30
  length: 100
  compute_gearnet: true
  compute_designability: false
  compute_diversity: true
  gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
