# @package _global_
# Resume sibling of training_repa_l4_256_per_residue_lambda2.yaml with
# projector_num_layers pinned to 2 to match the existing last.ckpt's depth-2
# projector (step 266000). Same run_name_ so Lightning resumes from
# /rds/.../store/proteina_60m_repa_l4_256_per_residue_lambda2/checkpoints/last.ckpt.
# Diagnostic-only: lambda sweep wants internal consistency, not the post-audit
# depth=3 fix that the master lambda2.yaml carries.
defaults:
  - /training_ca
  - _self_

run_name_: proteina_60m_repa_l4_256_per_residue_lambda2

dataset: pdb_lmdb_256
dataset_config_subdir: pdb

compile: true

log:
  wandb_project: proteina-repa
  checkpoint_every_n_steps: 100000
  last_ckpt_every_n_steps: 3500

ema:
  validate_original_weights: True

repa:
  encoder:
    type: gearnet
    gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
  layers: [4]
  lambda_repa: 2.0
  combination_mode: additive
  similarity_type: cosine
  averaging: per_residue
  projector_hidden_dim: 512
  projector_num_layers: 2  # matches existing depth-2 last.ckpt

eval_callback:
  enabled: false
  compute_every_n_steps: 50000
  num_samples: 30
  length: 100
  compute_gearnet: true
  compute_designability: false
  compute_diversity: true
  gearnet_ckpt_path: ${oc.env:DATA_PATH}/metric_factory/model_weights/gearnet_ca.pth
